    <path d="M64 69 C67 82 70 96 63 109 C57 97 53 85 50 74 Z" fill="#0b72bd"/>
    <path d="M69 70 C78 84 82 96 77 108 C68 96 62 86 57 75 Z" fill="#f5c84c"/>
